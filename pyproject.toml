[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "precisionmotion-rfq-workbench"
version = "0.1.0"
description = "Evidence-backed internal RFQ budget workbench; synthetic demonstration only"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1",
  "httpx>=0.28,<1", "python-multipart>=0.0.20", "python-dotenv>=1,<2",
  "pypdf>=6,<7", "pypdfium2>=4,<6", "openai>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["apps/api/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api/src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
