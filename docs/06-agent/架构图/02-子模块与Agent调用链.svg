<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1130" viewBox="0 0 1440 1130" role="img" aria-labelledby="title desc">
<title id="title">RFQ 工作台 · 子模块与 Agent 调用链</title><desc id="desc">浏览器逐步请求 Agent，Runner 保存观察及模型决策，按权限调用工具并持久化结果。网关分支负责文档证据、校验与知识、计价和交付。审批与 ERP 派发在独立的人工通道。</desc>
